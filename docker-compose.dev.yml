services:
  vue-project:
    container_name: vue-project_dev
    build:
      context: .
      dockerfile: dev.Dockerfile
    volumes:
      - ./:/app/
      - ./public:/app/public
      - /app/node_modules
    restart: always
    ports:
      - 5173:5173
    environment:
      - CHOKIDAR_USEPOLLING=true
